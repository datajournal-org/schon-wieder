<!DOCTYPE html>

<html lang="de">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
	<title>Schon wieder - Der Aufstieg der NSDAP/AfD</title>
	<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png" />

	<script>
		// temporary quick fix
		if (location.hostname === 'datajournal-org.github.io') {
			location.host = 'datajournal.org';
		}
	</script>

	<style>
		footer {
			margin-top: 10em;
		}

		footer a {
			color: inherit;
			text-decoration: none;
		}

		footer a:hover {
			text-decoration: underline;
		}

		footer dl {
			padding: 1em 0;
			margin: 1em 0 0;
			border-top: 1px solid rgba(0, 0, 0, 0.1);
			border-bottom: 1px solid rgba(0, 0, 0, 0.1);
			display: grid;
			width: 100%;
			column-gap: 0.5em;
			row-gap: 0.2em;
		}

		footer dt {
			font-weight: bold;
			margin: 0;
			padding: 0;
			grid-column: 1/1;
			text-align: right;
		}

		footer dd {
			margin: 0;
			padding: 0;
			grid-column: 2/2;
		}

		footer div {
			text-align: center;
		}

		footer nav {
			padding: 1em 0;
			background: #fff;
			color: #000;
		}

		footer nav ul {
			list-style: none;
			padding: 0;
			margin: 0;
			text-align: center;
			display: flex;
			justify-content: center;
			gap: 1em;
		}
	</style>

	<meta property="og:type" content="article" />
	<meta property="og:title" content="Schon wieder" />
	<meta property="og:description" content="Der Aufstieg der NSDAP/AfD" />
	<meta property="og:image" content="https://datajournal.org/schon-wieder/preview.png" />

	<meta name="twitter:title" content="Schon wieder" />
	<meta name="twitter:description" content="Der Aufstieg der NSDAP/AfD" />
	<meta name="twitter:image" content="https://datajournal.org/schon-wieder/preview.png" />
	<meta name="twitter:card" content="summary_large_image" />
	<style>
		/*style*/
	</style>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const spans = Array.from(document.querySelectorAll('.content span'));

			function update() {
				let y0 = window.innerHeight / 2;
				spans.forEach((span) => {
					let rect = span.getBoundingClientRect();
					if (rect.top + rect.height / 2 < y0) {
						span.classList.add('neu');
					} else {
						span.classList.remove('neu');
					}
				});
			}

			update();
			window.addEventListener('scroll', update);
		});
	</script>
</head>

<body>
	<div class="white"></div>
	<div class="content">
		<!--content-->
	</div>

		<nav>

</body>

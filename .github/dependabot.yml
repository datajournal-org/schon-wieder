version: 2

updates:
   - package-ecosystem: npm
     directory: /
     schedule:
        interval: weekly
        day: monday
     open-pull-requests-limit: 5
     commit-message:
        prefix: chore
     groups:
        # Minor- und Patch-Updates kommen gebündelt als je ein PR.
        # Major-Updates bleiben einzeln, damit sie nicht untergehen.
        production-dependencies:
           dependency-type: production
           update-types:
              - minor
              - patch
        dev-dependencies:
           dependency-type: development
           update-types:
              - minor
              - patch

   - package-ecosystem: github-actions
     directory: /
     schedule:
        interval: weekly
        day: monday
     commit-message:
        prefix: chore
     groups:
        github-actions:
           patterns:
              - '*'
